<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- circle badge -->
  <circle cx="40" cy="40" r="34" fill="url(#g)" filter="url(#s)"/>
  <!-- simplified jet -->
  <g transform="translate(40,40)" fill="#fff">
    <ellipse cx="0" cy="2" rx="18" ry="5" opacity="0.95"/>
    <path d="M-6,-2 L22,-8 L24,-5 L8,2 Z" opacity="0.9"/>
    <path d="M-4,2 L16,12 L18,9 L6,2 Z" opacity="0.85"/>
    <path d="M-16,0 L-10,-6 L-8,-4 L-12,0 L-8,4 L-10,6 Z"/>
    <circle cx="14" cy="-1" r="1.6"/>
  </g>
  <!-- wordmark -->
  <text x="88" y="36" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">AIRLINE</text>
  <text x="88" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" letter-spacing="2">SYSTEM MANAGEMENT</text>
</svg>
